<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0e1014" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vos_theme_v2')
          document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            'content',
            t === 'light' ? '#f4f5f7' : '#0e1014',
          )
        } catch (e) {}
      })()
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VOS-AI" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="application-name" content="VOS-AI" />
    <meta
      name="description"
      content="VOS IA es una plataforma modular: gestión, ventas, inventario, finanzas y un asistente que consulta los datos de cada empresa. vos-ia.com"
    />
    <title>VOS IA — La infraestructura inteligente para gestionar empresas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
