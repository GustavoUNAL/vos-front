name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Lint de los archivos de sesión y tienda
        run: npx eslint src/api.ts src/App.tsx src/backendHealth.ts src/lib/presetCredentials.ts src/lib/authRoutes.ts src/pos/services/websocket.ts src/shop/shopApi.ts src/shop/PublicShopApp.tsx src/components/PlatformAdminView.tsx src/components/GoogleAuthPopupView.tsx --max-warnings 0
